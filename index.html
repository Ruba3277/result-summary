<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <header></header>
  <main>
  <div class="card">
    <div class="result">
    <p id="para1">Your Result</p>
    <div class="score">
      <h1>76</h1>
      <h2>of 100</h2>
    </div>
    <div class="result-text">
    <h3>Great</h3>
    <p id="para2">You scored higher than 65% of the poeple who have taken these tests.</p></div>
  </div>
    <div class="summary">
      <h4>Summary</h4><ul class="summary-items">
      <li id="list-item-1" class="items"><div class="left"> <img src="icon-reaction.svg" class="images" alt="icon"><p>Reaction</p></div><p class="marks"><span class="value">80</span><span class="total">&nbsp/&nbsp100</span></p></li>
      <li id="list-item-2" class="items"><div class="left"><img src="icon-memory.svg" class="images" alt="icon"><p>Memory</p></div><p class="marks"><span class="value">92</span><span class="total">&nbsp/&nbsp100</span></p></li>
      <li id="list-item-3" class="items"><div class="left"><img src="icon-verbal.svg" class="images" alt="icon"><p>Verbal</p></div><p class="marks"><span class="value">61</span><span class="total">&nbsp/&nbsp100</span></p></li>
      <li id="list-item-4" class="items"><div class="left"><img src="icon-visual.svg" class="images" alt="icon"><p>Visual</p></div><p class="marks"><span class="value">73</span><span class="total">&nbsp/&nbsp100</span></p></li>
      
    </ul>
    <button>Continue</button>
    </div>
  </div>  
</main>
  <footer></footer>
</body>
</html>
